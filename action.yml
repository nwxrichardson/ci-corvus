name: 'corvus-comment'
description: 'Generate a comment showing Corvus comparisons'
branding:
  icon: 'box'
  color: 'purple'
runs:
  using: 'composite'
  steps:
    - name: Checkout ci-corvus
      uses: actions/checkout@v4
      with: 
        repository: nwxrichardson/ci-corvus
    - name: Checkout ci-corvus
      uses: actions/checkout@v4
      with: 
        repository: epsilonlabs/sirius-pr-action-workspace
        path: model/new
    - name: Checkout ci-corvus
      uses: actions/checkout@v4
      with: 
        repository: epsilonlabs/sirius-pr-action-workspace
        path: model/old
        ref: main
    - name: Tree
      run : tree
      shell: bash
    - name: Docker
      run : docker build -t ci-corvus:latest . 
      shell: bash
    - name: Docker run
      run : docker run -v $(pwd)/output:/output/ -v $(pwd)/model/new/bundles/psl.example:/example/new -v $(pwd)/model/old/bundles/psl.example:/example/old ci-corvus:latest
      shell: bash
    - name: Tree
      run : tree
      shell: bash
    - name: Upload README to S3
      run: |
          aws s3 cp --recursive $(pwd)/output/model/ s3://${{ env.BUCKET_NAME }}/model
      shell: bash  
    - name: Create comment from markdown file
      uses: GrantBirki/comment@v2.1.1
      with:
        file: output/plain-sample.md
